    <!-- Google Fonts: Montserrat com display=swap (nao bloqueia render) -->

    <!-- Tailwind CSS (Compilado Estático) -->

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #1A1A1A;
            color: #E0E0E0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        h1, h2, h3, h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900 !important;
            color: #FFFFFF;
        }

        .cta-button {
            background-color: #FF5400;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 8px;
            padding: 16px 24px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
            font-size: 16px;
        }

        .cta-button:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0px 6px 20px rgba(255, 84, 0, 0.6);
        }
    </style>
